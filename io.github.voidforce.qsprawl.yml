app-id: io.github.voidforce.qsprawl
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: io.github.voidforce.qsprawl.sh

rename-icon: gg.sprawl.sprawl96
rename-desktop-file: gg.sprawl.sprawl96.desktop


finish-args:
  # hardware 3D
  - --device=dri
  # X11 + XShm access
  - --share=ipc
  - --socket=x11
  - --share=network
  # Audio
  - --socket=pulseaudio

cleanup:
  - /include
  - '*.a'
  - '*.la'
  - /lib/pkgconfig

modules:
  - shared-modules/libmad/libmad.json
  - name: libxmp
    buildsystem: autotools
    sources:
      - type: archive
        url: https://api.github.com/repos/libxmp/libxmp/zipball/libxmp-4.7.2
        dest-filename: libxmp.zip
        sha256: 583af5ab3cfd2b3d5d0c6803fa7b24243017c0cd1388db4a069c2c21c356b584
        x-checker-data:
          type: json
          url: https://api.github.com/repos/libxmp/libxmp/releases/latest
          version-query: .tag_name | sub("^libxmp-"; "")
          url-query: .zipball_url
  - name: sprawl96-data
    buildsystem: simple
    sources:
      - type: archive
        url: https://drive.usercontent.google.com/download?export=download&confirm=yes&id=1ip_KFlA8BFRMbnvuOvTl2V_B-HOcqEHc
        dest-filename: sprawl96.zip
        sha256: 94c4be7b94c91e8b7683b6a50a40585be7eadd2440dd361ab14d0e79fb20e76e
    build-commands:
      - mkdir -p /app/bin/sprawl/music
      - install -vm644 -t /app/bin/sprawl/ pak0.pak sprawl.pak sprawl.dat
      - install -vm644 -t /app/bin/sprawl/music music/*
      - mv /app/bin/sprawl/pak0.pak /app/bin/sprawl/pak2.pak
  - name: librequake-data
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/lavenderdotpet/LibreQuake/releases/download/v0.09-beta/full.zip
        sha256: 623e463b35811216244f9ba15e0c45abc1765288650b5e3d36a899b35e4bcf3d
        x-checker-data:
          type: json
          url: https://api.github.com/repos/lavenderdotpet/LibreQuake/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="full.zip") | .browser_download_url
    build-commands:
      - mkdir -p /app/bin/sprawl /app/share/doc/librequake
      - install -vm644 -t /app/bin/sprawl id1/pak0.pak id1/pak1.pak
      - cp -vr id1/docs/* /app/share/doc/librequake/
  - name: qsprawl
    buildsystem: simple
    sources:
      - type: archive
        url: https://api.github.com/repos/VoidForce/QSprawl/zipball/b086b1b59d4f335236f34d0a324583eacd278306
        dest-filename: qsprawl.zip
        sha256: 465c21b595776b6456c4a52fc79b81b35dfb59c69ef9c60701ada309ce2dc674
        # x-checker-data:
        #   type: json
        #   url: https://api.github.com/repos/voidforce/qsprawl/branches/main
        #   tag-query: .tag
        #   commit-query: .commit.sha
      - type: script
        dest-filename: io.github.voidforce.qsprawl.sh
        commands:
          - mkdir -p $XDG_DATA_HOME/sprawl/maps
          - cd /app/bin
          - sprawl96 +game sprawl "$@"
          - if [[ "$?" != "0" ]]; then
          - export ERRMSG="For a detailed error message, please run SPRAWL 96"
          - export ERRMSG="$ERRMSG from a terminal using"
          - zenity --error --width=400 --title "SPRAWL 96 exited with an error" \
            --text "$ERRMSG\n<tt><b>flatpak run $FLATPAK_ID</b></tt>." --ok-label
            "Quit"
          - fi
      - type: patch
        path: userdir-log.patch
      - type: patch
        path: remove-registered-check.patch
      - type: file
        path: io.github.voidforce.qsprawl.metainfo.xml
    build-commands:
      # Build
      - cd Quake && make -j${FLATPAK_BUILDER_JOBS} LDFLAGS=-L/app/lib USE_CODEC_FLAC=1
        USE_CODEC_OPUS=1 USE_CODEC_XMP=1 DO_USERDIRS=1 DEBUG=1
      - cd Quake && make install PREFIX=/app
    post-install:
      # move sprawl96.pak
      - mv /app/share/games/quake/sprawl96.pak /app/bin/
      # Install launcher script
      - install -Dm755 -t /app/bin/ ${FLATPAK_ID}.sh
      - desktop-file-edit --set-key=Exec --set-value=${FLATPAK_ID}.sh /app/share/applications/gg.sprawl.sprawl96.desktop
      - desktop-file-edit --set-icon io.github.voidforce.qsprawl /app/share/applications/gg.sprawl.sprawl96.desktop
      # replace metainfo
      - install -Dm644 -t /app/share/metainfo io.github.voidforce.qsprawl.metainfo.xml
      - rm /app/share/metainfo/gg.sprawl.sprawl96.metainfo.xml
